# .github/workflows/deploy-to-cf-workers.yml

name: Deploy NeteaseCloudMusicApi to Cloudflare Workers (using npm)

on:
  push:
    branches:
      - main
      - master
      - tym2008-CF_Worker
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npm install hono @cloudflare/workers-types wrangler typescript

      # 关键修复: 在构建时动态生成路由，而不是使用 import.meta.glob
      - name: Create Worker entry and config files
        run: |
          mkdir -p src

          # 1. 写入文件的静态上半部分
          cat > src/index.ts << 'EOF'
          import { Hono } from 'hono';
          import { cors } from 'hono/cors';
          import { logger } from 'hono/logger';
          import type { Context } from 'hono';

          // Hono App 初始化和中间件
          const app = new Hono();
          app.use('*', logger());
          app.use('*', cors());

          // Express 适配器 (保持不变)
          async function expressAdapter(module: any, c: Context) {
              const url = new URL(c.req.url);
              const req = {
                  query: Object.fromEntries(url.searchParams),
                  body: c.req.header('Content-Type')?.includes('json') ? await c.req.json() : {},
                  cookies: c.req.cookie(),
                  headers: c.req.header(),
                  method: c.req.method,
                  path: url.pathname,
                  get: (field: string) => c.req.header(field),
              };
              let responseBody: any = '';
              let responseStatus = 200;
              const responseHeaders = new Headers({ 'Content-Type': 'application/json; charset=utf-8' });
              const res = {
                  status: (code: number) => { responseStatus = code; return res; },
                  send: (body: any) => { responseBody = body; },
                  set: (field: string, val: any) => {
                      if (field.toLowerCase() === 'set-cookie' && Array.isArray(val)) {
                          val.forEach(cookie => responseHeaders.append('Set-Cookie', cookie));
                      } else {
                          responseHeaders.set(field, val as string);
                      }
                  },
                  json: (body: any) => {
                      responseHeaders.set('Content-Type', 'application/json; charset=utf-8');
                      responseBody = JSON.stringify(body);
                  },
              };
              const result = module.default(req, res);
              if (result instanceof Promise) { await result; }
              if (typeof responseBody === 'object' && responseBody !== null) {
                  responseBody = JSON.stringify(responseBody);
              }
              return new Response(responseBody, { status: responseStatus, headers: responseHeaders });
          }

          // --- 动态路由生成开始 ---
          EOF

          # 2. 使用 shell 循环动态生成 import 和路由注册
          for file in module/*.js; do
            # 从文件名 'module/login_cellphone.js' 中提取 'login_cellphone'
            filename=$(basename "$file" .js)
            # 创建一个合法的 JS 变量名，如 'module_login_cellphone'
            identifier="module_${filename}"
            # 创建路由路径，如 '/login/cellphone'
            routePath="/${filename//_//}"

            # 追加 import 语句到 src/index.ts
            echo "import ${identifier} from '../${file}';" >> src/index.ts
            # 追加路由注册语句到 src/index.ts
            echo "app.on(['GET', 'POST', 'PUT', 'DELETE', 'PATCH', 'OPTIONS'], '${routePath}', (c) => expressAdapter(${identifier}.default, c));" >> src/index.ts
          done

          # 3. 写入文件的静态下半部分
          cat >> src/index.ts << 'EOF'
          // --- 动态路由生成结束 ---

          // 添加根路由作为健康检查
          app.get('/', (c) => c.text('NeteaseCloudMusicApi is running on Cloudflare Workers!'));
          
          // 导出 Hono app
          export default {
            fetch: app.fetch,
          };
          EOF

          # 写入 wrangler.toml 配置文件
          cat > wrangler.toml << EOF
          name = "${{ secrets.WORKER_NAME }}"
          main = "src/index.ts"
          compatibility_date = "2024-02-28"
          compatibility_flags = ["nodejs_compat"]
          EOF

      - name: Display final file structure and config
        run: |
          echo "--- Generated src/index.ts ---"
          cat src/index.ts
          echo "--- wrangler.toml content ---"
          cat wrangler.toml
          echo "------------------------------"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
